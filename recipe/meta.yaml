{% set name = "glodap" %}
{% set version = "0.4" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/g/glodap/glodap-{{ version }}.tar.gz
  sha256: d66a3ee96f458733a5c07df0558bb74a0e6f6ff632e0a87a56d936626a96f3cc

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - pandas >=3.0.3,<4
    - pooch >=1.9.0,<2
    - scipy >=1.17.1,<2

test:
  imports:
    - glodap
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: GLODAP downloader and importer in Python
  license: GPL-3.0-only
  license_file: LICENSE
  home: https://github.com/mvdh7/glodap

extra:
  recipe-maintainers:
    - mvdh7
